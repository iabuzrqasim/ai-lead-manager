<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead · AI Lead Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
<div id="page">
  <a href="/leads" class="small d-inline-block mb-3"><i class="bi bi-arrow-left"></i> All leads</a>
  <div class="alert alert-danger d-none" id="error"></div>

  <div class="row g-3">
    <!-- Left: details -->
    <div class="col-lg-4">
      <div class="card mb-3"><div class="card-body" id="details"></div></div>
      <div class="card"><div class="card-body">
        <h2 class="h6">Log activity</h2>
        <form id="activity-form" class="vstack gap-2">
          <select class="form-select form-select-sm" name="kind">
            <option value="note">Note</option><option value="call">Call</option>
            <option value="meeting">Meeting</option><option value="email">Email</option>
          </select>
          <textarea class="form-control form-control-sm" name="description" rows="2" placeholder="What happened?" required></textarea>
          <button class="btn btn-sm btn-outline-primary">Add to timeline</button>
        </form>
      </div></div>
    </div>

    <!-- Right: tabs -->
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header bg-white">
          <ul class="nav nav-tabs card-header-tabs">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-fu">Follow-ups</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-email">Email drafts</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-timeline">Timeline</button></li>
          </ul>
        </div>
        <div class="card-body tab-content">
          <div class="tab-pane fade show active" id="tab-fu">
            <form class="row g-2 align-items-end mb-3" id="fu-form">
              <div class="col-sm-4"><label class="form-label small">When</label><input class="form-control form-control-sm" type="datetime-local" name="scheduled_at" required></div>
              <div class="col-sm-3"><label class="form-label small">Channel</label>
                <select class="form-select form-select-sm" name="channel"><option>email</option><option>call</option><option>whatsapp</option><option>meeting</option></select></div>
              <div class="col-sm-5"><label class="form-label small">Note</label><input class="form-control form-control-sm" name="note" placeholder="e.g. Ask about proposal feedback"></div>
              <div class="col-12"><button class="btn btn-sm btn-primary" id="fu-submit"><i class="bi bi-calendar-plus"></i> Schedule follow-up</button></div>
            </form>
            <div id="fu-list"></div>
          </div>

          <div class="tab-pane fade" id="tab-email">
            <div class="alert alert-light border small" id="email-config"></div>
            <form class="row g-2 align-items-end mb-3" id="gen-form">
              <div class="col-sm-4"><label class="form-label small">Purpose</label>
                <select class="form-select form-select-sm" name="purpose">
                  <option value="follow-up">Follow-up</option><option value="first introduction">First introduction</option>
                  <option value="proposal check-in">Proposal check-in</option><option value="meeting request">Meeting request</option>
                  <option value="re-engage a cold lead">Re-engage cold lead</option></select></div>
              <div class="col-sm-8"><label class="form-label small">Extra context (optional)</label><input class="form-control form-control-sm" name="extra_context" placeholder="e.g. They asked about WhatsApp automation"></div>
              <div class="col-12"><button class="btn btn-sm btn-primary" id="gen-btn"><i class="bi bi-stars"></i> Generate draft</button></div>
            </form>
            <div id="draft-list"></div>
          </div>

          <div class="tab-pane fade" id="tab-timeline"><ul class="timeline" id="timeline"></ul></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Edit lead modal -->
<div class="modal fade" id="edit-modal" tabindex="-1">
  <div class="modal-dialog modal-lg"><form class="modal-content" id="edit-form" novalidate>
    <div class="modal-header"><h5 class="modal-title">Edit lead</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="alert alert-danger d-none" id="edit-error"></div>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Name *</label><input class="form-control" name="name" required minlength="2"></div>
        <div class="col-md-6"><label class="form-label">Email *</label><input class="form-control" name="email" type="email" required></div>
        <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div>
        <div class="col-md-6"><label class="form-label">Company</label><input class="form-control" name="company"></div>
        <div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status"></select></div>
        <div class="col-md-4"><label class="form-label">Source</label><input class="form-control" name="source"></div>
        <div class="col-md-4"><label class="form-label">Estimated value ($)</label><input class="form-control" name="estimated_value" type="number" min="0"></div>
        <div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="3"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline-danger me-auto" id="delete"><i class="bi bi-trash"></i> Delete lead</button>
      <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
      <button class="btn btn-primary">Save changes</button>
    </div>
  </form></div>
</div>

<!-- Edit draft modal -->
<div class="modal fade" id="draft-modal" tabindex="-1">
  <div class="modal-dialog modal-lg"><form class="modal-content" id="draft-form">
    <div class="modal-header"><h5 class="modal-title">Review & edit draft</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body vstack gap-3">
      <div><label class="form-label">Subject</label><input class="form-control" name="subject" required></div>
      <div><label class="form-label">Body</label><textarea class="form-control" name="body" rows="12" required></textarea></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
      <button class="btn btn-primary">Save draft</button>
    </div>
  </form></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script>
  const leadId = Number(new URLSearchParams(location.search).get("id"));
  renderLayout("leads", "Lead details",
    `<button class="btn btn-outline-secondary btn-sm" id="edit-btn"><i class="bi bi-pencil"></i> Edit</button>`);
  const editModal = new bootstrap.Modal(qs("#edit-modal"));
  const draftModal = new bootstrap.Modal(qs("#draft-modal"));
  qs("#edit-form [name=status]").innerHTML = STATUSES.map(s => `<option>${s}</option>`).join("");
  qs("#fu-form [name=scheduled_at]").value = defaultFollowUpInput(1);
  let lead, emailCfg, drafts = [];

  function showError(msg) { qs("#error").textContent = msg; qs("#error").classList.remove("d-none"); }

  function renderDetails() {
    const row = (icon, label, value) => `<div class="d-flex mb-2"><i class="bi ${icon} text-secondary me-2"></i>
      <div><div class="small text-secondary">${label}</div><div>${value}</div></div></div>`;
    qs("#details").innerHTML = `
      <div class="d-flex align-items-start mb-3">
        <div class="me-auto"><h2 class="h5 mb-0">${esc(lead.name)}</h2><div class="text-secondary">${esc(lead.company || "")}</div></div>
        ${statusBadge(lead.status)}
      </div>
      <label class="form-label small text-secondary">Move to stage</label>
      <select class="form-select form-select-sm mb-3" id="quick-status">${STATUSES.map(s => `<option ${s === lead.status ? "selected" : ""}>${s}</option>`).join("")}</select>
      ${row("bi-envelope", "Email", `<a class="text-break" href="mailto:${esc(lead.email)}">${esc(lead.email)}</a>`)}
      ${row("bi-telephone", "Phone", esc(lead.phone || "—"))}
      ${row("bi-signpost", "Source", esc(lead.source || "—"))}
      ${row("bi-cash", "Estimated value", money(lead.estimated_value))}
      ${row("bi-calendar", "Created", fmtDate(lead.created_at))}
      ${lead.notes ? `<hr><div class="small text-secondary">Notes</div><div style="white-space:pre-wrap">${esc(lead.notes)}</div>` : ""}`;
    qs("#quick-status").onchange = async (e) => {
      try { lead = await api(`/api/leads/${leadId}`, { method: "PATCH", body: { status: e.target.value } });
        toast(`Moved to ${lead.status}`); refreshAll(); }
      catch (ex) { toast(ex.message, "error"); }
    };
    const closed = ["Won", "Lost"].includes(lead.status);
    qs("#fu-submit").disabled = closed;
    qs("#fu-submit").title = closed ? "Won/Lost leads don't get follow-ups" : "";
  }

  async function loadFollowUps() {
    const box = qs("#fu-list"); setLoading(box);
    const fus = await api(`/api/leads/${leadId}/follow-ups`);
    box.innerHTML = fus.length ? `<div class="list-group">${fus.slice().reverse().map(f => {
      const open = ["Pending", "Due"].includes(f.status);
      return `<div class="list-group-item d-flex align-items-center gap-2">
        <div class="me-auto">
          <div class="${open && isPast(f.scheduled_at) ? "overdue" : ""}"><i class="bi bi-clock"></i> ${fmtDateTime(f.scheduled_at)} · ${esc(f.channel)}</div>
          ${f.note ? `<div class="small text-secondary">${esc(f.note)}</div>` : ""}
        </div>
        ${statusBadge(f.status)}
        ${open ? `<button class="btn btn-sm btn-outline-success" data-act="complete" data-id="${f.id}" title="Mark completed"><i class="bi bi-check-lg"></i></button>
                  <button class="btn btn-sm btn-outline-secondary" data-act="cancel" data-id="${f.id}" title="Cancel"><i class="bi bi-x-lg"></i></button>` : ""}
      </div>`; }).join("")}</div>` : emptyState("bi-calendar", "No follow-ups scheduled yet.");
  }

  async function loadDrafts() {
    const box = qs("#draft-list"); setLoading(box);
    drafts = await api(`/api/leads/${leadId}/drafts`);
    box.innerHTML = drafts.length ? drafts.map(d => `
      <div class="card mb-2"><div class="card-body">
        <div class="d-flex align-items-start gap-2 mb-2">
          <div class="me-auto"><div class="fw-semibold">${esc(d.subject)}</div>
            <div class="small text-secondary">${fmtDateTime(d.created_at)} · ${esc(d.generated_by)}${d.sent_to ? " · sent to " + esc(d.sent_to) : ""}</div></div>
          ${statusBadge(d.status)}
        </div>
        <pre class="draft-body small border rounded p-2 bg-light">${esc(d.body)}</pre>
        ${d.error ? `<div class="small text-danger mt-2"><i class="bi bi-exclamation-triangle"></i> ${esc(d.error)}</div>` : ""}
        ${d.status !== "Sent" ? `<div class="mt-2 d-flex gap-2 flex-wrap">
          <button class="btn btn-sm btn-outline-primary" data-act="edit" data-id="${d.id}"><i class="bi bi-pencil"></i> Edit</button>
          <button class="btn btn-sm btn-outline-secondary" data-act="copy" data-id="${d.id}"><i class="bi bi-clipboard"></i> Copy</button>
          <button class="btn btn-sm btn-success" data-act="send" data-id="${d.id}" ${emailCfg?.sending_enabled ? "" : "disabled title='Email sending is disabled in .env'"}><i class="bi bi-send"></i> Send</button>
          <button class="btn btn-sm btn-outline-danger ms-auto" data-act="delete" data-id="${d.id}"><i class="bi bi-trash"></i></button>
        </div>` : ""}
      </div></div>`).join("") : emptyState("bi-envelope", "No drafts yet. Generate one above.");
  }

  async function loadTimeline() {
    const acts = await api(`/api/leads/${leadId}/activities`);
    qs("#timeline").innerHTML = acts.length ? acts.map(a => `<li>
      <div class="small text-secondary">${fmtDateTime(a.created_at)} · ${esc(a.kind.replace("_", " "))}</div>
      <div>${esc(a.description)}</div></li>`).join("") : emptyState("bi-clock-history", "No activity yet.");
  }

  async function refreshAll() {
    try { await Promise.all([loadFollowUps(), loadDrafts(), loadTimeline()]); renderDetails(); }
    catch (ex) { showError(ex.message); }
  }

  async function init() {
    if (!leadId) { showError("No lead selected."); return; }
    try {
      [lead, emailCfg] = await Promise.all([api(`/api/leads/${leadId}`), api("/api/email/config")]);
      document.title = `${lead.name} · AI Lead Manager`;
      qs("#email-config").innerHTML = `<i class="bi bi-info-circle"></i>
        Drafts are generated by <strong>${emailCfg.ai_enabled ? "AI (Claude)" : "a built-in template"}</strong>.
        Sending is <strong>${emailCfg.sending_enabled ? "enabled" : "disabled"}</strong>${emailCfg.test_inbox ? ` and redirected to test inbox <code>${esc(emailCfg.test_inbox)}</code>` : ""}.
        Every email must be reviewed and sent manually.`;
      renderDetails(); await refreshAll();
    } catch (ex) { showError(ex.message); }
  }

  // Follow-ups
  qs("#fu-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = formToObject(e.target);
    body.scheduled_at = localInputToIso(body.scheduled_at);
    try { await api(`/api/leads/${leadId}/follow-ups`, { method: "POST", body }); toast("Follow-up scheduled");
      e.target.note.value = ""; refreshAll(); }
    catch (ex) { toast(ex.message, "error"); }
  });
  qs("#fu-list").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    try { await api(`/api/follow-ups/${b.dataset.id}/${b.dataset.act}`, { method: "POST" });
      toast(b.dataset.act === "complete" ? "Follow-up completed" : "Follow-up cancelled"); refreshAll(); }
    catch (ex) { toast(ex.message, "error"); }
  });

  // Drafts
  qs("#gen-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = qs("#gen-btn"); btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Generating…`;
    try {
      const res = await api(`/api/leads/${leadId}/drafts/generate`, { method: "POST", body: formToObject(e.target) });
      toast(res.warning || "Draft ready for review", res.warning ? "warning" : "success"); refreshAll();
    } catch (ex) { toast(ex.message, "error"); }
    finally { btn.disabled = false; btn.innerHTML = `<i class="bi bi-stars"></i> Generate draft`; }
  });
  let editingDraft = null;
  qs("#draft-list").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const d = drafts.find(x => x.id === Number(b.dataset.id));
    try {
      if (b.dataset.act === "edit") {
        editingDraft = d; qs("#draft-form").subject.value = d.subject; qs("#draft-form").body.value = d.body; draftModal.show();
      } else if (b.dataset.act === "copy") {
        await navigator.clipboard.writeText(`Subject: ${d.subject}\n\n${d.body}`); toast("Copied to clipboard");
      } else if (b.dataset.act === "send") {
        const to = emailCfg.test_inbox || lead.email;
        if (!confirm(`Send "${d.subject}" to ${to}?`)) return;
        b.disabled = true; await api(`/api/drafts/${d.id}/send`, { method: "POST" }); toast(`Email sent to ${to}`); refreshAll();
      } else if (b.dataset.act === "delete") {
        if (!confirm("Delete this draft?")) return;
        await api(`/api/drafts/${d.id}`, { method: "DELETE" }); toast("Draft deleted"); refreshAll();
      }
    } catch (ex) { toast(ex.message, "error"); refreshAll(); }
  });
  qs("#draft-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try { await api(`/api/drafts/${editingDraft.id}`, { method: "PUT", body: formToObject(e.target) });
      draftModal.hide(); toast("Draft saved"); refreshAll(); }
    catch (ex) { toast(ex.message, "error"); }
  });

  // Activity
  qs("#activity-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try { await api(`/api/leads/${leadId}/activities`, { method: "POST", body: formToObject(e.target) });
      e.target.reset(); toast("Activity logged"); refreshAll(); }
    catch (ex) { toast(ex.message, "error"); }
  });

  // Edit / delete lead
  qs("#edit-btn").onclick = () => {
    const f = qs("#edit-form");
    ["name", "email", "phone", "company", "status", "source", "estimated_value", "notes"].forEach(k => f[k].value = lead[k] ?? "");
    qs("#edit-error").classList.add("d-none"); editModal.show();
  };
  qs("#edit-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target; if (!f.checkValidity()) { f.classList.add("was-validated"); return; }
    const body = formToObject(f);
    body.estimated_value = body.estimated_value == null ? null : Number(body.estimated_value);
    try { lead = await api(`/api/leads/${leadId}`, { method: "PATCH", body }); editModal.hide(); toast("Lead updated"); refreshAll(); }
    catch (ex) { qs("#edit-error").textContent = ex.message; qs("#edit-error").classList.remove("d-none"); }
  });
  qs("#delete").onclick = async () => {
    if (!confirm(`Delete ${lead.name} and all follow-ups, drafts and activity? This cannot be undone.`)) return;
    try { await api(`/api/leads/${leadId}`, { method: "DELETE" }); location.href = "/leads"; }
    catch (ex) { toast(ex.message, "error"); }
  };

  init();
</script>
</body>
</html>
