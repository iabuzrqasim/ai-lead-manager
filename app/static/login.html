<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · AI Lead Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card shadow-lg">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="fs-1 text-brand"><i class="bi bi-lightning-charge-fill"></i></div>
          <h1 class="h4 fw-bold mb-1">AI Lead Manager</h1>
          <p class="text-secondary small mb-0">TechNest Nova · Lead & follow-up automation</p>
        </div>
        <div class="alert alert-danger d-none" id="error"></div>
        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="username" type="email" autocomplete="username" required>
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" id="submit" type="submit">Sign in</button>
        </form>
        <p class="text-center text-secondary small mt-4 mb-0">Demo login is set in your <code>.env</code> file.</p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    if (auth.token) location.href = "/dashboard";
    qs("#login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = qs("#submit"), err = qs("#error");
      err.classList.add("d-none");
      btn.disabled = true; btn.textContent = "Signing in…";
      try {
        const data = await api("/api/auth/login", { method: "POST", form: new FormData(e.target) });
        auth.set(data.access_token);
        location.href = "/dashboard";
      } catch (ex) {
        err.textContent = ex.message; err.classList.remove("d-none");
      } finally {
        btn.disabled = false; btn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
